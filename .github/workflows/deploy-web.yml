name: Deploy website to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin packages to Expo SDK 54
        working-directory: app
        run: |
          mkdir -p /tmp/expo-sdk && cd /tmp/expo-sdk
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps expo@~54.0.0 >/dev/null
          cd -
          node scripts/align-deps.mjs /tmp/expo-sdk/node_modules/expo
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build legal pages
        run: node legal/build.mjs
      - name: Build web
        working-directory: app
        run: |
          npx expo export -p web
          # Firebase Hosting never uploads folders named node_modules, so move bundled assets (fonts) out of it.
          if [ -d dist/assets/node_modules ]; then
            mv dist/assets/node_modules dist/assets/vendor
            grep -rl "assets/node_modules" dist | xargs -r sed -i 's#assets/node_modules#assets/vendor#g'
          fi
          ls dist/assets/vendor/@expo-google-fonts | head
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: .
      # Billing (Cloud Functions + database rules). Turned on by setting the repo variable DEPLOY_BILLING to true,
      # after the Paystack secret exists in Secret Manager and the plan code is in the PAYSTACK_PLAN_CODE variable.
      - name: Deploy billing functions and database rules
        if: ${{ vars.DEPLOY_BILLING == 'true' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PLAN_CODE: ${{ vars.PAYSTACK_PLAN_CODE }}
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          printf 'PAYSTACK_PLAN_CODE=%s\nAPP_URL=https://meal-planner-sa.web.app\n' "$PLAN_CODE" > functions/.env
          (cd functions && npm install --no-audit --no-fund)
          npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project meal-planner-sa --non-interactive --force
          rm -f /tmp/sa.json
