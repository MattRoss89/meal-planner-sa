<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f3">
<title>Tafel Weekly Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tafel: an apothecary-quiet planner. Paper ground, olive ink, sage label colour, amber for training.
   One grotesque at regular weight; structure from full-width hairlines, never cards or shadows. */
:root{
  --paper:#fbf9f3; --ink:#454b39; --soft:#7d8172; --rule:#454b39; --hair:#dedbd0;
  --sage:#dfe7d2; --sage-ink:#3d4433; --oil:#a87b2c; --brick:#9a4a35;
  --font:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1d201a; --ink:#e9e6db; --soft:#a3a596; --rule:#e9e6db; --hair:#353a2f;
  --sage:#323a2b; --sage-ink:#e4ead9; --oil:#d6a956; --brick:#e08a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1d201a; --ink:#e9e6db; --soft:#a3a596; --rule:#e9e6db; --hair:#353a2f;
  --sage:#323a2b; --sage-ink:#e4ead9; --oil:#d6a956; --brick:#e08a73; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
.cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.soft{color:var(--soft)}
.link{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link:hover{text-decoration-thickness:2px}

/* Masthead */
.bar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:880px;margin:0 auto;height:52px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.wordmark{font-size:15px;letter-spacing:.42em;font-weight:500;margin-right:-.42em}
.bar .l{justify-self:start}.bar .r{justify-self:end}
.tabs{border-bottom:1px solid var(--hair)}
.tabs-in{max-width:880px;margin:0 auto;display:flex;gap:28px;justify-content:center;padding:0 20px}
.tab{padding:13px 0 11px;border-bottom:1px solid transparent;margin-bottom:-1px;color:var(--soft)}
.tab[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
main{max-width:880px;margin:0 auto;padding:0 20px 88px}
.notice{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--sage);color:var(--sage-ink);text-align:center;font-size:12.5px;padding:8px 16px calc(8px + env(safe-area-inset-bottom))}

/* Section heads */
.sec{border-top:1px solid var(--rule);margin-top:40px;padding-top:16px}
.sec:first-child{margin-top:28px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.sec-h h2{display:flex;align-items:center;gap:12px;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.sec-h h2::before{content:"";width:6px;height:6px;background:currentColor;flex:none}

/* Summary */
.summary{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:end;padding-top:28px}
.total{font-size:clamp(44px,9vw,68px);line-height:1;letter-spacing:-.02em}
.total small{font-size:15px;letter-spacing:.01em;color:var(--soft);margin-left:8px}
.state{text-align:right}
.state.over{color:var(--brick)}
.line{grid-column:1/-1;height:1px;background:var(--hair);position:relative;margin:14px 0 6px}
.line i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.line.over i{background:var(--brick)}
.summary .note{grid-column:1/-1}

/* Week */
.week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.day{padding:12px 0 10px;text-align:center;border-left:1px solid var(--hair);display:grid;gap:2px;justify-items:center}
.day:first-child{border-left:0}
.day .dn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.day .dd{font-size:22px;line-height:1.1}
.day .mk{font-size:10px;letter-spacing:.1em;height:14px;color:var(--oil)}
.day.short .mk{color:var(--brick)}
.day[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink)}
.day[aria-pressed="true"] .dn{color:var(--sage-ink)}
.day-title{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 4px}
.day-title h3{font-size:28px;letter-spacing:-.01em}
.day-title .act{color:var(--oil)}
.targets{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:14px 0 6px}
.tgt .row{display:flex;justify-content:space-between}
.tgt .v{font-size:20px}
.tgt .line{margin:8px 0 0}

/* Meals */
.meals{border-top:1px solid var(--rule);margin-top:20px}
.meal{display:grid;grid-template-columns:110px 1fr auto;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--hair)}
.meal-when{color:var(--soft)}
.meal-main{text-align:left;display:grid;gap:4px}
.meal-name{font-size:19px;line-height:1.25}
.meal-meta{color:var(--soft);font-size:13.5px}
.portion{color:var(--oil)}
.meal-act{display:flex;gap:16px;font-size:13.5px}
.meal-act button[aria-pressed="true"]{color:var(--oil)}
.snacks{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--hair)}
@media (max-width:600px){
  .meal{grid-template-columns:1fr auto;gap:6px 14px}.meal-when{grid-column:1/-1}
  .snacks{grid-template-columns:1fr;gap:4px}
  .tabs-in{gap:20px}
  .day .dd{font-size:18px}
}
.actions{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);padding:14px 22px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
.btn:hover{opacity:.88}
.btn.line-btn{background:none;color:var(--ink);border:1px solid var(--ink)}
.para{max-width:62ch;color:var(--soft);font-size:13.5px;margin-top:18px}

/* Stores */
.stores{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.store{padding:12px 10px;border-left:1px solid var(--hair);text-align:left;display:grid;gap:2px}
.store:first-child{border-left:0}
.store .v{font-size:18px}
.store[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink)}
@media (max-width:600px){.stores{grid-template-columns:1fr 1fr}.store{border-left:0;border-top:1px solid var(--hair)}.store:nth-child(even){border-left:1px solid var(--hair)}.store:nth-child(-n+2){border-top:0}}

/* Shopping label: a sage apothecary label holding the list */
.label{background:var(--sage);color:var(--sage-ink);padding:30px 26px 22px;margin-top:22px}
.label-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid currentColor;padding-bottom:12px}
.label-head .wm{font-size:14px;letter-spacing:.38em}
.label-meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;padding:8px 0 4px;opacity:.85}
.aisle{margin:22px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid color-mix(in srgb,currentColor 22%,transparent)}
.item input{appearance:none;width:13px;height:13px;border:1px solid currentColor;margin:0;position:relative;top:1px;background:transparent}
.item input:checked{background:currentColor}
.item.done .nm{text-decoration:line-through;opacity:.55}
.item .dt{font-size:12.5px;opacity:.75;display:flex;gap:12px}
.item .dt a{color:inherit}
.label-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid currentColor;margin-top:16px;padding-top:12px;font-size:20px}
.label-foot{font-size:12.5px;opacity:.8;margin-top:6px}

/* Compare */
.cmp{display:grid;gap:10px}
.cmp-row{display:grid;grid-template-columns:120px 1fr 80px;gap:14px;align-items:center}
.cmp-row .track{height:1px;background:var(--hair);position:relative}
.cmp-row .track i{position:absolute;left:0;top:-1px;height:3px;background:var(--soft)}
.cmp-row.cur .track i{background:var(--ink)}
.cmp-row .v{text-align:right}
@media (max-width:420px){.cmp-row{grid-template-columns:90px 1fr 64px}}

/* Forms */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px 28px}
.field{display:grid;gap:8px}
.field label,.field .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.field input,.field select,.tr select,.pr input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);padding:8px 0;font-size:17px;border-radius:0;appearance:none}
.field select,.tr select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;padding-right:20px}
select{color-scheme:inherit}
select option{background:var(--paper);color:var(--ink)}
select option:checked{background:var(--sage);color:var(--sage-ink)}
.field input:focus,.field select:focus,.tr select:focus,.pr input:focus{outline:0;border-bottom-width:2px}
.affix{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--ink)}
.affix span{font-size:17px;color:var(--soft)}
.affix input{border:0!important}
.stepper{display:flex;align-items:center;border-bottom:1px solid var(--ink)}
.stepper button{width:36px;height:40px;font-size:20px;color:var(--soft)}
.stepper output{flex:1;text-align:center;font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.opt{padding:10px 14px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font-size:14px}
.opt[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink)}
.toggle{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair)}
.toggle small{display:block;color:var(--soft);font-size:13px}
.sw{appearance:none;width:40px;height:22px;border:1px solid var(--ink);position:relative;flex:none;margin:0;background:transparent}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--ink);transition:transform .2s}
.sw:checked{background:var(--sage)}
.sw:checked::after{transform:translateX(18px)}
.tr{display:grid;grid-template-columns:60px 1fr 90px;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.tr .k{text-align:right;color:var(--soft);font-size:13.5px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.big .v{font-size:44px;line-height:1.05;letter-spacing:-.02em}
.prices{max-height:440px;overflow:auto;border-top:1px solid var(--hair)}
.pr{display:grid;grid-template-columns:1fr 110px;gap:16px;align-items:center;padding:6px 0;border-bottom:1px solid var(--hair)}
.pr input{text-align:right;font-size:15px;padding:4px 0}
.pr .ah{grid-column:1/-1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding-top:14px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:flex-end;animation:fade .2s ease}
.sheet{background:var(--paper);width:min(520px,100%);height:100%;overflow:auto;padding:22px 28px calc(28px + env(safe-area-inset-bottom));border-left:1px solid var(--rule);animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:22px}
.sheet h2{font-size:28px;letter-spacing:-.01em;margin-bottom:6px}
.sheet .sub{color:var(--soft);margin-bottom:18px}
.sheet h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:26px 0 8px}
.ing{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair)}
.ing li span{color:var(--soft)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr}
.steps li::before{content:counter(s,decimal-leading-zero);color:var(--soft)}
.alt{width:100%;display:grid;grid-template-columns:1fr auto;gap:14px;text-align:left;padding:14px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.alt:first-of-type{border-top:1px solid var(--hair)}
.alt:hover .an{text-decoration:underline;text-underline-offset:3px}
.alt .an{font-size:17px}
.alt small{display:block;color:var(--soft);font-size:13px}
.delta.up{color:var(--brick)}.delta.down{color:var(--oil)}
.sheet textarea{width:100%;min-height:300px;border:1px solid var(--hair);background:transparent;padding:14px;font:13px/1.6 var(--font);color:var(--ink)}
@media (max-width:600px){.sheet-bg{align-items:flex-end}.sheet{height:auto;max-height:88vh;border-left:0;border-top:1px solid var(--rule);animation-name:up}}
.toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:11px 18px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;animation:tin .2s ease}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(40px);opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><span class="l cap soft" id="weekof"></span><span class="wordmark" aria-label="Tafel">TAFEL</span><span class="r cap" id="cart"></span></div></header>
<nav class="tabs" aria-label="Sections"><div class="tabs-in cap" id="nav"></div></nav>
<main id="app"></main>
<div class="notice" id="notice"></div>
<script>
/*__CORE__*/

// ---------------- State ----------------
const TABS=[['plan','The week'],['list','Groceries'],['fitness','Training'],['settings','Settings']];
let state={tab:'plan',day:todayIdx(),settings:mergeSettings(null),plan:null,locked:{},overrides:{},checked:{}};
let priceFeed=null,db=null,userId=null,saveTimer=null,sheet=null,lastFocus=null;
const LS_KEY='mealplanner-sa-v1';

function todayIdx(){return (new Date().getDay()+6)%7}
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-todayIdx());return d}
function dayDate(i){const d=weekStart();d.setDate(d.getDate()+i);return d}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'R'+Math.round(n).toLocaleString('en-ZA').replace(/ /g,' ')}
function money2(n){return 'R'+n.toFixed(2)}
const plural=(n,w)=>n===1?`1 ${w}`:`${n} ${w==='person'?'people':w+'s'}`;
const shortStore=k=>({shoprite:'Shoprite',checkers:'Checkers',pnp:'Pick n Pay',spar:'Spar',woolworths:'Woolworths'}[k]);
const cap1=s=>s[0].toUpperCase()+s.slice(1);
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

function persisted(){return {settings:state.settings,plan:state.plan,locked:state.locked,overrides:state.overrides,checked:state.checked}}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(persisted()))}catch(e){}
  if(!db||!userId)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{try{await db.doc('data/users/'+userId+'/state').set(JSON.parse(JSON.stringify(persisted())))}catch(e){console.warn('save failed',e)}},800);
}
function applySaved(s){state.settings=mergeSettings(s.settings);state.plan=s.plan||null;state.locked=s.locked||{};state.overrides=s.overrides||{};state.checked=s.checked||{}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s)applySaved(s)}catch(e){}}
function currentList(){return state.plan?buildList(state.plan,state.settings,priceFeed,state.overrides):null}
function targets(){return state.settings.fitness.enabled?fitnessTargets(state.settings.fitness):null}

function regenerate(keepLocks=true,quiet=false){
  const res=generatePlan(state.settings,priceFeed,state.overrides,{locked:keepLocks?state.locked:{}});
  state.plan=res.plan;state.checked={};if(!keepLocks)state.locked={};
  save();render();
  if(quiet)return;
  if(res.warning)toast(res.warning);
  else if(res.overBudget)toast('Cheapest week found is still over budget');
  else toast('A new week is planned');
}

const sec=(title,right,body)=>`<section class="sec"><div class="sec-h"><h2>${title}</h2>${right||''}</div>${body}</section>`;

// ---------------- Views ----------------
function summary(list){
  const s=state.settings,b=s.weeklyBudget,t=list.total,over=t>b;
  const cheapest=Object.entries(list.byStore).sort((a,c)=>a[1]-c[1])[0];
  const saving=list.byStore[s.store]-cheapest[1];
  return `<div class="summary">
    <div><div class="cap soft">Groceries this week at ${shortStore(s.store)}</div><div class="total">${money(t)}<small>of ${money(b)}</small></div></div>
    <div class="state ${over?'over':''}">${over?money(t-b)+' over budget':money(b-t)+' to spare'}</div>
    <div class="line ${over?'over':''}" role="meter" aria-label="Spend against budget" aria-valuemin="0" aria-valuemax="${b}" aria-valuenow="${Math.round(t)}"><i style="width:${Math.min(100,t/b*100)}%"></i></div>
    <div class="note soft">${saving>5?`The same list costs about ${money(saving)} less at ${shortStore(cheapest[0])}.`:`${shortStore(s.store)} is the most affordable store for this list.`}</div>
  </div>`;
}

function renderPlan(){
  const s=state.settings,tg=targets(),list=currentList();
  const slots=['breakfast','lunch','dinner'].filter(m=>s.meals[m]);
  const di=state.day,d=state.plan.days[di],n=dayNutrition(d),date=dayDate(di),act=s.fitness.week[di];
  let h=summary(list);
  let body=`<div class="week" role="group" aria-label="Choose a day">`+DAYS.map((nm,i)=>{
    const train=tg&&s.fitness.week[i]!=='rest',short=tg&&dayNutrition(state.plan.days[i]).protein<tg.days[i].protein-5;
    return `<button class="day ${short?'short':''}" data-day="${i}" aria-pressed="${i===di}" aria-label="${nm} ${dayDate(i).getDate()}${train?', training day':''}"><span class="dn">${nm}</span><span class="dd">${dayDate(i).getDate()}</span><span class="mk">${short?'Low protein':train?'Training':''}</span></button>`}).join('')+`</div>`;
  body+=`<div class="day-title"><h3>${date.toLocaleDateString('en-ZA',{weekday:'long'})} ${date.getDate()} ${date.toLocaleDateString('en-ZA',{month:'long'})}</h3>${tg?`<span class="cap ${act!=='rest'?'act':'soft'}">${esc(ACTIVITIES[act].label)}</span>`:''}</div>`;
  if(tg){
    const t=tg.days[di],pp=Math.min(100,n.protein/t.protein*100),kp=Math.min(100,n.kcal/t.kcal*100);
    body+=`<div class="targets">
      <div class="tgt"><div class="row cap soft"><span>Protein</span><span>${Math.round(pp)}%</span></div><div class="v">${n.protein} g <span class="soft">of ${t.protein} g</span></div><div class="line"><i style="width:${pp}%"></i></div></div>
      <div class="tgt"><div class="row cap soft"><span>Energy</span><span>${Math.round(kp)}%</span></div><div class="v">${n.kcal.toLocaleString('en-ZA')} <span class="soft">of ${t.kcal.toLocaleString('en-ZA')} kcal</span></div><div class="line"><i style="width:${kp}%"></i></div></div></div>`;
  }
  body+=`<div class="meals">`;
  for(const m of slots){
    const r=d[m]&&recipeById(d[m]),key=di+':'+m,lk=!!state.locked[key];
    if(!r){body+=`<div class="meal"><span class="meal-when cap">${m}</span><span class="soft">No recipe fits your requirements</span><span></span></div>`;continue}
    const rn=recipeNutrition(r),p=d.portion||1;
    body+=`<div class="meal"><span class="meal-when cap">${m}</span>
      <button class="meal-main" data-recipe="${r.id}"><span class="meal-name">${esc(r.name)}</span><span class="meal-meta">${r.mins} min &nbsp;•&nbsp; ${Math.round(rn.protein*p)} g protein${p!==1?` &nbsp;•&nbsp; <span class="portion">Your portion ×${p}</span>`:''}</span></button>
      <span class="meal-act"><button class="link" data-lock="${key}" aria-pressed="${lk}" aria-label="${lk?'Release':'Keep'} ${esc(r.name)} when re-planning">${lk?'Kept':'Keep'}</button><button class="link" data-swap="${key}" aria-label="Swap ${m}">Swap</button></span></div>`;
  }
  if(d.snacks&&d.snacks.length)body+=`<div class="snacks"><span class="meal-when cap" style="color:var(--oil)">Snacks</span><span>${d.snacks.map(x=>esc(recipeById(x).name)).join(' &nbsp;•&nbsp; ')}</span></div>`;
  body+=`</div><div class="actions"><button class="btn" data-act="gen">Plan a new week</button>${Object.keys(state.locked).length?`<button class="link soft" data-act="genall">Release ${plural(Object.keys(state.locked).length,'kept meal')}</button>`:''}</div>`;
  if(!tg)body+=`<p class="para">${n.protein} g protein and ${n.kcal.toLocaleString('en-ZA')} kcal per person today. Add your training to plan portions around it.</p>`;
  return h+sec('This week',`<span class="cap soft">${plural(s.householdSize,'person')}</span>`,body);
}

function renderList(){
  const list=currentList(),s=state.settings;
  const main=list.items.filter(i=>s.includeStaples||!i.staple),staples=list.items.filter(i=>i.staple&&!s.includeStaples);
  const left=main.filter(i=>!state.checked[i.id]).length;
  let h=summary(list);
  let stores=`<div class="stores" role="group" aria-label="Store">`+Object.keys(STORES).map(k=>`<button class="store" data-store="${k}" aria-pressed="${s.store===k}"><span class="cap">${shortStore(k)}</span><span class="v">${money(list.byStore[k])}</span></button>`).join('')+`</div>`;
  h+=sec('Where to shop','',stores);
  let lab=`<div class="label"><div class="label-head"><span class="wm">TAFEL</span><span class="cap">Shopping list</span></div>
    <div class="label-meta"><span>Week of ${weekStart().toLocaleDateString('en-ZA',{day:'numeric',month:'long'})}</span><span>${left} of ${main.length} to collect</span></div>`;
  let aisle='';
  for(const i of main){
    if(i.aisle!==aisle){aisle=i.aisle;lab+=`<div class="aisle">${esc(aisle)}</div>`}
    const done=!!state.checked[i.id];
    lab+=`<div class="item ${done?'done':''}"><input type="checkbox" id="c-${i.id}" data-check="${i.id}" ${done?'checked':''}><label for="c-${i.id}"><span class="nm">${i.packs>1?i.packs+' × ':''}${esc(i.name)}</span><span class="dt"><span>uses ${i.unit==='ea'?Math.ceil(i.qty-0.05):formatQty(i)}</span><a class="link" href="${esc(storeSearchUrl(s.store,i))}" target="_blank" rel="noopener" aria-label="Find ${esc(i.name)} at ${shortStore(s.store)}">Find at ${shortStore(s.store)}</a></span></label><span>${money2(i.cost)}</span></div>`;
  }
  lab+=`<div class="label-total"><span>Estimated total</span><span>${money2(list.total)}</span></div>`;
  if(staples.length)lab+=`<div class="label-foot">Check your cupboard for ${staples.map(i=>esc(i.name.replace(/ \(.*\)/,'').toLowerCase())).join(', ')}.</div>`;
  lab+=`</div><div class="actions"><button class="btn" data-act="copy">Copy list</button><button class="link" data-act="showtext">View as text</button>${Object.keys(state.checked).length?`<button class="link soft" data-act="uncheck">Untick all</button>`:''}</div>`;
  h+=sec('The list','',lab);
  const max=Math.max(...Object.values(list.byStore));
  h+=sec('Compared','',`<div class="cmp">`+Object.entries(list.byStore).sort((a,c)=>a[1]-c[1]).map(([k,v])=>`<div class="cmp-row ${k===s.store?'cur':''}"><span>${shortStore(k)}</span><span class="track"><i style="width:${v/max*100}%"></i></span><span class="v">${money(v)}</span></div>`).join('')+`</div><p class="para">${priceFeed&&priceFeed.updatedAt?'Prices last refreshed '+new Date(priceFeed.updatedAt).toLocaleDateString('en-ZA',{day:'numeric',month:'long'})+'. ':'Prices are estimates until the first monthly refresh. '}Other stores are estimated from a basket price index. Sixty60, PnP asap! and Woolworths Dash don't let other apps sign in, so each item links to the store's own search.</p>`);
  return h;
}

const opts=(group,o,sel)=>`<div class="opts">${Object.entries(o).map(([k,v])=>`<button class="opt" data-chip="${group}" data-val="${k}" aria-pressed="${sel.includes(k)}">${esc(v.label)}</button>`).join('')}</div>`;

function renderSettings(){
  const s=state.settings;
  let h=sec('Household','',`<div class="fields">
    <div class="field"><span class="lbl" id="l-hh">People eating</span><div class="stepper" role="group" aria-labelledby="l-hh"><button data-step="-1" aria-label="Fewer people">−</button><output>${s.householdSize}</output><button data-step="1" aria-label="More people">+</button></div></div>
    <div class="field"><label for="f-budget">Weekly grocery budget</label><div class="affix"><span>R</span><input id="f-budget" type="number" inputmode="numeric" min="100" step="50" data-set="weeklyBudget" value="${s.weeklyBudget}"></div></div>
    <div class="field"><label for="f-store">Where you shop</label><select id="f-store" data-set="store">${Object.keys(STORES).map(k=>`<option value="${k}" ${s.store===k?'selected':''}>${esc(STORES[k].name)}</option>`).join('')}</select></div></div>
    <div class="field" style="margin-top:26px"><span class="lbl">Meals to plan</span><div class="opts">${['breakfast','lunch','dinner'].map(m=>`<button class="opt" data-meal="${m}" aria-pressed="${s.meals[m]}">${cap1(m)}</button>`).join('')}</div></div>
    <div class="toggle" style="margin-top:14px"><label for="f-staples">Count pantry staples in the total<small>Oil, spices, flour, stock cubes and sauces</small></label><input class="sw" type="checkbox" id="f-staples" data-set="includeStaples" ${s.includeStaples?'checked':''}></div>`);
  h+=sec('Dietary requirements','',`<div class="field"><span class="lbl">Avoid</span>${opts('diets',DIETS,s.diets)}</div><div class="field" style="margin-top:22px"><span class="lbl">Lean towards</span>${opts('prefs',PREFERENCES,s.prefs)}</div>
    <p class="para">For halal, buy halal-certified meat. Boerewors counts as containing pork; stock cubes, oats and soy sauce count as containing gluten.</p>`);
  let pr=`<p class="para" style="margin-top:0;margin-bottom:14px">Base prices are Checkers. Enter what you pay and every plan will use it.</p><div class="prices">`;let aisle='';
  for(const [id,ing] of Object.entries(INGREDIENTS).sort((a,c)=>a[1].aisle.localeCompare(c[1].aisle))){
    if(ing.aisle!==aisle){aisle=ing.aisle;pr+=`<div class="pr"><span class="ah">${esc(aisle)}</span></div>`}
    pr+=`<div class="pr"><label for="p-${id}">${esc(ing.name)}</label><input id="p-${id}" type="number" inputmode="decimal" step="0.01" placeholder="${priceOf(id,'checkers',priceFeed,null).toFixed(2)}" data-price="${id}" value="${state.overrides[id]??''}"></div>`;
  }
  h+=sec('Your prices','',pr+`</div>`);
  h+=`<p class="para">${userId?'Your settings and plans are saved to your account.':'Your settings and plans are saved in this browser.'}</p>`;
  return h;
}

function renderFitness(){
  const f=state.settings.fitness;
  let h=sec('Training','',`<div class="toggle" style="border-top:0;padding-top:0"><label for="f-fit" style="font-size:19px">Plan around my training<small>Larger portions on training days, a daily protein target, and protein snacks added to the list when meals fall short.</small></label><input class="sw" type="checkbox" id="f-fit" data-fit="enabled" ${f.enabled?'checked':''}></div>`);
  if(!f.enabled)return h+`<p class="para">Targets apply to one person in the household. Everyone else eats a standard portion.</p>`;
  const t=fitnessTargets(f);
  h+=sec('Daily targets','',`<div class="big"><div><div class="v">${t.protein} g</div><div class="soft">protein a day, ${t.perKg} g per kg</div></div><div><div class="v">${t.restKcal.toLocaleString('en-ZA')}</div><div class="soft">kcal on a rest day</div></div></div>`);
  h+=sec('The week of training','',DAYS.map((d,i)=>`<div class="tr"><span class="cap">${d}</span><select aria-label="${d} training" data-week="${i}">${Object.entries(ACTIVITIES).map(([k,v])=>`<option value="${k}" ${f.week[i]===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select><span class="k">${t.days[i].kcal.toLocaleString('en-ZA')} kcal</span></div>`).join(''));
  h+=sec('About you','',`<div class="fields">
    <div class="field"><label for="ff-w">Weight, kg</label><input id="ff-w" type="number" inputmode="decimal" data-fit="weightKg" value="${f.weightKg}"></div>
    <div class="field"><label for="ff-h">Height, cm</label><input id="ff-h" type="number" inputmode="numeric" data-fit="heightCm" value="${f.heightCm}"></div>
    <div class="field"><label for="ff-a">Age</label><input id="ff-a" type="number" inputmode="numeric" data-fit="age" value="${f.age}"></div>
    <div class="field"><label for="ff-s">Sex, for the calorie formula</label><select id="ff-s" data-fit="sex"><option value="male" ${f.sex==='male'?'selected':''}>Male</option><option value="female" ${f.sex==='female'?'selected':''}>Female</option></select></div>
    <div class="field"><label for="ff-p">Your own protein, g/day</label><input id="ff-p" type="number" inputmode="numeric" data-fit="proteinOverride" placeholder="${t.protein}" value="${f.proteinOverride??''}"></div>
    <div class="field"><label for="ff-k">Your own rest-day kcal</label><input id="ff-k" type="number" inputmode="numeric" data-fit="kcalOverride" placeholder="${t.restKcal}" value="${f.kcalOverride??''}"></div></div>
    <div class="field" style="margin-top:26px"><span class="lbl">Goal</span><div class="opts">${Object.entries(GOALS).map(([k,v])=>`<button class="opt" data-goal="${k}" aria-pressed="${f.goal===k}">${esc(v.label)}</button>`).join('')}</div></div>
    <div class="toggle" style="margin-top:14px"><label for="ff-sn">Add protein snacks<small>Eggs, yoghurt, milk or tuna, added when meals fall short</small></label><input class="sw" type="checkbox" id="ff-sn" data-fit="snacks" ${f.snacks?'checked':''}></div>
    <div class="actions"><button class="btn" data-act="gen">Re-plan the week</button></div>
    <p class="para">Targets are estimates from the Mifflin-St Jeor formula and typical session burn, a starting point rather than medical advice.</p>`);
  return h;
}

function openSheet(s){lastFocus=document.activeElement;sheet=s;renderSheet()}
function closeSheet(){sheet=null;renderSheet();if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function renderSheet(){
  document.querySelectorAll('.sheet-bg').forEach(e=>e.remove());
  if(!sheet)return;
  const bg=document.createElement('div');bg.className='sheet-bg';bg.dataset.close='1';
  let inner='',kicker='';
  if(sheet.type==='swap'){
    const [d,slot]=sheet.key.split(':');const cur=currentList().total;
    const alts=alternatives(state.plan,+d,slot,state.settings,priceFeed,state.overrides);
    kicker='Swap';
    inner=`<h2 id="sh-t">${DAYS[d]} ${slot}</h2><p class="sub">Ordered by what each does to this week's total.</p>`+alts.map(a=>{const dl=Math.round(a.total-cur);return `<button class="alt" data-pick="${a.recipe.id}"><span><span class="an">${esc(a.recipe.name)}</span><small>${a.recipe.mins} min &nbsp;•&nbsp; ${a.nutrition.protein} g protein &nbsp;•&nbsp; ${a.nutrition.kcal} kcal</small></span><span class="delta ${dl>0?'up':dl<0?'down':''}">${dl===0?'Same cost':(dl>0?'+':'−')+money(Math.abs(dl))}</span></button>`}).join('');
  }else if(sheet.type==='recipe'){
    const r=recipeById(sheet.id),n=recipeNutrition(r),hh=state.settings.householdSize;
    kicker='Recipe';
    inner=`<h2 id="sh-t">${esc(r.name)}</h2><p class="sub">${r.mins} minutes &nbsp;•&nbsp; ${n.protein} g protein &nbsp;•&nbsp; ${n.kcal} kcal per person</p><h3>Ingredients for ${plural(hh,'person')}</h3><ul class="ing">`+Object.entries(r.ing).map(([id,q])=>{const ing=INGREDIENTS[id];return `<li>${esc(ing.name.replace(/ \(.*\)/,''))}<span>${formatQty({qty:q*hh/4,unit:ing.unit})}</span></li>`}).join('')+`</ul><h3>Method</h3><ol class="steps">`+r.steps.map(x=>`<li><span>${esc(x)}</span></li>`).join('')+`</ol>`;
  }else if(sheet.type==='text'){
    kicker='Groceries';
    inner=`<h2 id="sh-t">Shopping list</h2><p class="sub">Select all, then paste into WhatsApp or Notes.</p><textarea readonly aria-labelledby="sh-t">${esc(listAsText(currentList(),state.settings))}</textarea>`;
  }
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-top"><span class="cap soft">${kicker}</span><button class="cap link" data-close="1">Close</button></div>${inner}</div>`;
  document.body.appendChild(bg);
  bg.querySelector('.sheet [data-close]')?.focus();
}

function render(){
  if(!state.plan)regenerate(true,true);
  document.getElementById('nav').innerHTML=TABS.map(([id,l])=>`<button class="tab" data-tab="${id}" ${state.tab===id?'aria-current="page"':''}>${l}</button>`).join('');
  const v={plan:renderPlan,list:renderList,fitness:renderFitness,settings:renderSettings}[state.tab]();
  document.getElementById('app').innerHTML=v;
  const ws=weekStart(),we=dayDate(6);
  document.getElementById('weekof').textContent=`${ws.getDate()}–${we.getDate()} ${we.toLocaleDateString('en-ZA',{month:'short'})}`;
  document.getElementById('cart').textContent=`(${money(currentList().total)})`;
  document.getElementById('notice').textContent=priceFeed&&priceFeed.updatedAt?`Prices refreshed ${new Date(priceFeed.updatedAt).toLocaleDateString('en-ZA',{day:'numeric',month:'long'})} • Next refresh on the 1st`:'Prices are estimates • Refreshed on the 1st of every month';
  renderSheet();
}

// ---------------- Events ----------------
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-store],[data-lock],[data-swap],[data-recipe],[data-chip],[data-meal],[data-pick],[data-close],[data-day],[data-step],[data-goal]');
  if(!t)return;
  if(t.dataset.close){if(t.classList.contains('sheet-bg')&&e.target!==t)return;closeSheet();return}
  const s=state.settings;
  if(t.dataset.tab){state.tab=t.dataset.tab;sheet=null;render();window.scrollTo(0,0);return}
  if(t.dataset.day){state.day=+t.dataset.day;render();return}
  if(t.dataset.store){s.store=t.dataset.store;save();render();return}
  if(t.dataset.step){s.householdSize=Math.min(12,Math.max(1,s.householdSize+ +t.dataset.step));save();render();return}
  if(t.dataset.goal){s.fitness.goal=t.dataset.goal;save();render();return}
  if(t.dataset.lock){const k=t.dataset.lock;if(state.locked[k])delete state.locked[k];else{const [d,m]=k.split(':');state.locked[k]=state.plan.days[+d][m]}save();render();return}
  if(t.dataset.swap){openSheet({type:'swap',key:t.dataset.swap});return}
  if(t.dataset.recipe){openSheet({type:'recipe',id:t.dataset.recipe});return}
  if(t.dataset.pick){const [d,slot]=sheet.key.split(':');state.plan=applySwap(state.plan,+d,slot,t.dataset.pick,s);state.locked[sheet.key]=t.dataset.pick;sheet=null;save();render();toast('Meal swapped and kept');return}
  if(t.dataset.chip){const arr=s[t.dataset.chip];const i=arr.indexOf(t.dataset.val);if(i>=0)arr.splice(i,1);else arr.push(t.dataset.val);save();render();return}
  if(t.dataset.meal){s.meals[t.dataset.meal]=!s.meals[t.dataset.meal];save();render();return}
  const a=t.dataset.act;
  if(a==='gen'){state.tab='plan';regenerate(true);window.scrollTo(0,0)}
  if(a==='genall'){regenerate(false)}
  if(a==='uncheck'){state.checked={};save();render()}
  if(a==='showtext')openSheet({type:'text'});
  if(a==='copy'){try{await navigator.clipboard.writeText(listAsText(currentList(),s));toast('List copied')}catch(err){openSheet({type:'text'})}}
});
document.addEventListener('change',e=>{
  const t=e.target,s=state.settings;
  if(t.dataset.check){if(t.checked)state.checked[t.dataset.check]=true;else delete state.checked[t.dataset.check];save();render();return}
  if(t.dataset.set){const k=t.dataset.set;s[k]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(100,Number(t.value)||100):t.value;save();render();return}
  if(t.dataset.price){const v=t.value.trim();if(v==='')delete state.overrides[t.dataset.price];else state.overrides[t.dataset.price]=Number(v);save();render();return}
  if(t.dataset.fit){const k=t.dataset.fit;let v=t.type==='checkbox'?t.checked:t.value;if(t.type==='number')v=v===''?(k.endsWith('Override')?null:s.fitness[k]):Number(v);s.fitness[k]=v;save();if(k==='enabled'&&v)regenerate(true,true);render();return}
  if(t.dataset.week){s.fitness.week[+t.dataset.week]=t.value;save();render();return}
});

// ---------------- Boot ----------------
loadLocal();
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d)return;
    db=d;
    db.doc('prices/current').onSnapshot(snap=>{if(snap.exists){priceFeed=snap.data();render()}},()=>{});
    const id=u?await u.id():null;
    if(!id)return;
    userId=id;
    const snap=await db.doc('data/users/'+id+'/state').get();
    if(snap.exists){applySaved(snap.data());render()}else save();
  }catch(e){console.warn(e)}
})();
</script>
</body>
</html>
