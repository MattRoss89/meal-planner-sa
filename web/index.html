<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Meal Planner SA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2321;--muted:#68716d;--line:#e4e2dc;--brand:#1f7a4d;--brand-soft:#e3f1e9;--warn:#b54708;--warn-soft:#fdf0e2;--bad:#b42318;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1b1f1e;--ink:#eef1ef;--muted:#9aa39f;--line:#2b302e;--brand:#4cc08a;--brand-soft:#1d3329;--warn:#f2a65a;--warn-soft:#3a2a1a;--bad:#f97066}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
main{max-width:720px;margin:0 auto;padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
nav button .ic{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5}
.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.total{font-size:28px;font-weight:700;letter-spacing:-.5px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.over i{background:var(--warn)}
.day h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.slot{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .lbl{width:68px;flex:none;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.slot .nm{flex:1;min-width:0}
.slot .nm b{font-weight:500;display:block}
.slot .nm span{font-size:12px;color:var(--muted)}
.icon-btn{border:0;background:none;font-size:17px;padding:6px;cursor:pointer;color:var(--muted);border-radius:8px}
.icon-btn.on{color:var(--brand)}
.aisle{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 4px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item input{width:20px;height:20px;accent-color:var(--brand)}
.item .nm{flex:1}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item a{font-size:13px;color:var(--brand);text-decoration:none;white-space:nowrap}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=number],input[type=text],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.store{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;background:var(--card);color:var(--ink);text-align:left;font:inherit}
.store b{display:block;font-size:16px}
.store.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:80vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 10px;font-size:17px}
.alt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.nut{font-size:12px;color:var(--muted)}
.ok{color:var(--brand)}.low{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:30}
textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,monospace;background:var(--card);color:var(--ink)}
.empty{text-align:center;padding:30px 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td input{width:90px}
</style>
</head>
<body>
<header><h1>Weekly Meal Planner SA</h1><div class="sub" id="sub">Budget meals, grocery list &amp; fitness targets</div></header>
<main id="app"></main>
<nav id="nav"></nav>

// diet rules, fitness targets, the budget planner and grocery-list builder.
// Pure JavaScript with no dependencies, used by both the Expo app and the web preview.

// ---------- Stores ----------
// Price index relative to Checkers (= 1.00). Checkers R1,618 vs PnP R1,676 vs
// Woolworths R2,097 for the same basket (PriceCheck via BusinessTech, Mar 2025).

  shoprite:   { name: 'Shoprite',     index: 0.97, search: q => `https://www.shoprite.co.za/search?Search=${encodeURIComponent(q)}` },

// flags: m=red meat, c=poultry, f=fish, p=pork, d=dairy, e=egg, g=gluten, n=nuts

// qty is for 4 servings. lc = low-carb friendly.

const SNACKS = [
  { id: 's_eggs', name: '2 boiled eggs', ing: { eggs: 2 } },

// ---------- Diets ----------
const DIETS = {
  vegetarian:  { label: 'Vegetarian', no: 'mcpf' },
  vegan:       { label: 'Vegan', no: 'mcpfde' },
  pescatarian: { label: 'Pescatarian', no: 'mcp' },
  halal:       { label: 'Halal / no pork', no: 'p' },
  no_red_meat: { label: 'No red meat', no: 'mp' },
  gluten_free: { label: 'Gluten-free', no: 'g' },
  dairy_free:  { label: 'Dairy-free', no: 'd' },
  egg_free:    { label: 'Egg-free', no: 'e' },
  nut_free:    { label: 'Nut-free', no: 'n' },
  fish_free:   { label: 'No fish', no: 'f' },
};
const PREFERENCES = {
  low_carb: { label: 'Prefer low-carb' },
  high_protein: { label: 'Prefer high-protein' },
};

// ---------- Fitness ----------
const ACTIVITIES = {
  rest:     { label: 'Rest', kcal: 0 },
  easy_run: { label: 'Easy run', kcal: 450 },
  speed:    { label: 'Speed / intervals', kcal: 550 },
  long_run: { label: 'Long run', kcal: 900 },
  strength: { label: 'Strength / gym', kcal: 300 },
  sport:    { label: 'Sport / cycling', kcal: 500 },
  walk:     { label: 'Walk / light', kcal: 200 },
};
const GOALS = {
  maintain: { label: 'Maintain / performance', kcalAdj: 1.0, proteinPerKg: 1.4 },
  lose:     { label: 'Lose fat', kcalAdj: 0.85, proteinPerKg: 1.8 },
  gain:     { label: 'Build muscle', kcalAdj: 1.1, proteinPerKg: 1.8 },
};
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

const DEFAULT_SETTINGS = {
  householdSize: 2,
  weeklyBudget: 1200,
  store: 'checkers',
  diets: [],
  prefs: [],
  meals: { breakfast: true, lunch: true, dinner: true },
  includeStaples: false,
  fitness: {
    enabled: false,
    weightKg: 75, heightCm: 178, age: 30, sex: 'male',
    goal: 'maintain',
    week: ['easy_run', 'strength', 'speed', 'rest', 'easy_run', 'long_run', 'rest'],
    proteinOverride: null, // g/day
    kcalOverride: null,    // kcal/day on a rest day
    snacks: true,
  },
};

function mergeSettings(s) {
  const d = DEFAULT_SETTINGS;
  s = s || {};
  return {
    ...d, ...s,
    meals: { ...d.meals, ...(s.meals || {}) },
    fitness: { ...d.fitness, ...(s.fitness || {}), week: (s.fitness && Array.isArray(s.fitness.week) && s.fitness.week.length === 7) ? s.fitness.week : d.fitness.week },
    diets: Array.isArray(s.diets) ? s.diets : [],
    prefs: Array.isArray(s.prefs) ? s.prefs : [],
  };
}

// Per-person daily targets. Mifflin-St Jeor BMR x 1.3 everyday living, plus the day's exercise.
function fitnessTargets(f) {
  const w = Number(f.weightKg) || 75, h = Number(f.heightCm) || 175, a = Number(f.age) || 30;
  const bmr = 10 * w + 6.25 * h - 5 * a + (f.sex === 'female' ? -161 : 5);
  const goal = GOALS[f.goal] || GOALS.maintain;
  const restKcal = f.kcalOverride ? Number(f.kcalOverride) : Math.round(bmr * 1.3 * goal.kcalAdj);
  const strengthDays = f.week.filter(x => x === 'strength').length;
  const perKg = Math.min(2.2, goal.proteinPerKg + (strengthDays >= 2 ? 0.2 : 0));
  const protein = f.proteinOverride ? Number(f.proteinOverride) : Math.round(w * perKg);
  const days = f.week.map(act => {
    const ex = Math.round(((ACTIVITIES[act] || ACTIVITIES.rest).kcal) * (w / 70));
    return { activity: act, kcal: restKcal + ex, protein };
  });
  return { bmr: Math.round(bmr), restKcal, protein, perKg: Math.round(perKg * 10) / 10, days };
}

// ---------- Pricing ----------
// priceFeed: { items: { id: { price, pack? } }, storeIndex?: {store: idx}, updatedAt, source }
// overrides: { id: price } set by the user.
function priceOf(id, store, priceFeed, overrides) {
  const ing = INGREDIENTS[id];
  if (overrides && overrides[id] != null && overrides[id] !== '') return Number(overrides[id]);
  const feed = priceFeed && priceFeed.items && priceFeed.items[id];
  const base = feed && feed.price ? Number(feed.price) : ing.price;
  const idx = (priceFeed && priceFeed.storeIndex && priceFeed.storeIndex[store]) || STORES[store].index;
  return Math.round(base * idx * 100) / 100;
}
function packOf(id, priceFeed) {
  const feed = priceFeed && priceFeed.items && priceFeed.items[id];
  return (feed && feed.pack) || INGREDIENTS[id].pack;
}

function recipeById(id) { return RECIPES.find(r => r.id === id) || SNACKS.find(s => s.id === id); }

// Nutrition per serving (one person).
function recipeNutrition(r) {
  let p = 0, k = 0;
  const servings = r.ing && r.id.startsWith('s_') ? 1 : 4;
  for (const [id, q] of Object.entries(r.ing)) {
    const ing = INGREDIENTS[id];
    const f = ing.unit === 'ea' ? q : q / 100;
    p += ing.protein * f; k += ing.kcal * f;
  }
  return { protein: Math.round(p / servings), kcal: Math.round(k / servings) };
}

function allowedRecipe(r, diets) {
  const banned = diets.map(d => (DIETS[d] || { no: '' }).no).join('');
  if (!banned) return true;
  return Object.keys(r.ing).every(id => ![...INGREDIENTS[id].flags].some(fl => banned.includes(fl)));
}

// ---------- Grocery list ----------
// plan: { days: [ { breakfast, lunch, dinner, snacks: [ids] } x7 ] } ; each slot holds a recipe id or null.
function buildList(plan, settings, priceFeed, overrides) {
  const s = settings;
  const need = {};
  const add = (id, q) => { need[id] = (need[id] || 0) + q; };
  for (const day of plan.days) {
    // The fitness person eats `portion` servings; everyone else 1 serving.
    const scale = (s.householdSize - 1 + (day.portion || 1)) / 4;
    for (const slot of ['breakfast', 'lunch', 'dinner']) {
      const r = day[slot] && recipeById(day[slot]);
      if (r) for (const [id, q] of Object.entries(r.ing)) add(id, q * scale);
    }
    for (const sid of day.snacks || []) {
      const sn = recipeById(sid);
      if (sn) for (const [id, q] of Object.entries(sn.ing)) add(id, q);
    }
  }
  const items = Object.entries(need).map(([id, qty]) => {
    const ing = INGREDIENTS[id];
    const pack = packOf(id, priceFeed);
    const packs = Math.max(1, Math.ceil(qty / pack - 1e-9));
    const unitPrice = priceOf(id, s.store, priceFeed, overrides);
    return {
      id, name: ing.name, aisle: ing.aisle, staple: ing.staple, search: ing.search,
      qty, unit: ing.unit, packs, unitPrice, cost: Math.round(packs * unitPrice * 100) / 100,
    };
  }).sort((a, b) => a.aisle.localeCompare(b.aisle) || a.name.localeCompare(b.name));
  const counted = items.filter(i => s.includeStaples || !i.staple);
  const total = Math.round(counted.reduce((t, i) => t + i.cost, 0) * 100) / 100;
  const byStore = {};
  for (const st of Object.keys(STORES)) {
    byStore[st] = Math.round(counted.reduce((t, i) => t + i.packs * priceOf(i.id, st, priceFeed, null), 0));
  }
  return { items, total, byStore };
}

function formatQty(item) {
  const q = item.qty;
  if (item.unit === 'g') return q >= 1000 ? `${(q / 1000).toFixed(1)} kg` : `${Math.round(q)} g`;
  if (item.unit === 'ml') return q >= 1000 ? `${(q / 1000).toFixed(1)} L` : `${Math.round(q)} ml`;
  return `${Math.round(q * 10) / 10}`;
}

function listAsText(list, settings) {
  const lines = [`Grocery list (${STORES[settings.store].name}) ~R${Math.round(list.total)}`];
  let aisle = '';
  for (const i of list.items) {
    if (!settings.includeStaples && i.staple) continue;
    if (i.aisle !== aisle) { aisle = i.aisle; lines.push('', aisle.toUpperCase()); }
    lines.push(`- ${i.name} x${i.packs}  (R${i.cost.toFixed(2)})`);
  }
  const st = list.items.filter(i => i.staple && !settings.includeStaples);
  if (st.length) lines.push('', 'CHECK PANTRY', ...st.map(i => `- ${i.name}`));
  return lines.join('\n');
}

// ---------- Day nutrition ----------
function dayNutrition(day) {
  let protein = 0, kcal = 0;
  const f = day.portion || 1;
  for (const slot of ['breakfast', 'lunch', 'dinner']) {
    const r = day[slot] && recipeById(day[slot]);
    if (r) { const n = recipeNutrition(r); protein += n.protein * f; kcal += n.kcal * f; }
  }
  protein = Math.round(protein); kcal = Math.round(kcal);
  for (const sid of day.snacks || []) { const n = recipeNutrition(recipeById(sid)); protein += n.protein; kcal += n.kcal; }
  return { protein, kcal };
}

// ---------- Planner ----------
function rng(seed) { let x = seed >>> 0 || 1; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }

function candidates(meal, settings) {
  return RECIPES.filter(r => r.meal === meal && allowedRecipe(r, settings.diets));
}

function snackCandidates(settings) {
  return SNACKS.filter(sn => allowedRecipe(sn, settings.diets));
}

function addSnacks(plan, settings, targets) {
  const opts = snackCandidates(settings).map(sn => ({ sn, n: recipeNutrition(sn) }))
    .sort((a, b) => b.n.protein - a.n.protein);
  plan.days.forEach((day, di) => {
    day.snacks = [];
    day.portion = 1;
    if (!settings.fitness.enabled || !targets) return;
    // Scale the fitness person's portions toward the day's calorie target (0.8x-1.7x).
    const base = dayNutrition(day).kcal;
    if (base > 0) day.portion = Math.round(Math.min(1.7, Math.max(0.8, targets.days[di].kcal / base)) * 10) / 10;
    if (!settings.fitness.snacks) return;
    let guard = 0;
    while (dayNutrition(day).protein < targets.days[di].protein - 5 && guard++ < 3 && opts.length) {
      const pick = opts[(di + guard) % Math.min(3, opts.length)];
      day.snacks.push(pick.sn.id);
    }
  });
}

// Plan cost + fit score. Lower cost, more variety, closer protein/kcal match = better.
function evaluate(plan, settings, priceFeed, overrides, targets) {
  const list = buildList(plan, settings, priceFeed, overrides);
  let score = 0;
  const counts = {};
  for (const d of plan.days) for (const sl of ['breakfast', 'lunch', 'dinner']) if (d[sl]) counts[d[sl]] = (counts[d[sl]] || 0) + 1;
  for (const c of Object.values(counts)) score -= (c - 1) * (c - 1) * 30; // repeats
  // Reward a mix of chicken / red meat / fish / meat-free dinners (within the diet).
  const kinds = new Set(plan.days.map(d => {
    const r = d.dinner && recipeById(d.dinner); if (!r) return null;
    const fl = Object.keys(r.ing).map(id => INGREDIENTS[id].flags).join('');
    return fl.includes('c') ? 'c' : fl.includes('m') ? 'm' : fl.includes('f') ? 'f' : 'v';
  }).filter(Boolean));
  score += kinds.size * 20;
  if (settings.prefs.includes('low_carb')) for (const d of plan.days) for (const sl of ['breakfast', 'lunch', 'dinner']) { const r = d[sl] && recipeById(d[sl]); if (r && r.lc) score += 60; }
  if ((settings.prefs.includes('high_protein') || settings.fitness.enabled) && targets) {
    plan.days.forEach((d, i) => {
      const n = dayNutrition(d);
      score -= Math.max(0, targets.days[i].protein - n.protein) * 2.5;
      if (settings.fitness.enabled) score -= Math.abs(targets.days[i].kcal - n.kcal) * 0.02;
    });
  } else if (settings.prefs.includes('high_protein')) {
    for (const d of plan.days) score += dayNutrition(d).protein * 0.5;
  }
  const over = list.total - settings.weeklyBudget;
  score -= over > 0 ? over * 3 + 500 : 0;
  score -= list.total * 0.05; // gentle push toward cheaper
  return { score, list };
}

function generatePlan(settings, priceFeed, overrides, opts = {}) {
  const s = mergeSettings(settings);
  const locked = opts.locked || {}; // { 'dayIdx:slot': recipeId }
  const base = opts.basePlan;
  const targets = s.fitness.enabled ? fitnessTargets(s.fitness) : null;
  const rand = rng(opts.seed || Date.now());
  const slots = ['breakfast', 'lunch', 'dinner'].filter(m => s.meals[m]);
  const pools = Object.fromEntries(slots.map(m => [m, candidates(m, s)]));
  const empty = slots.find(m => pools[m].length === 0);
  let best = null;
  const iterations = opts.iterations || 400;
  for (let it = 0; it < iterations; it++) {
    const plan = { days: DAYS.map(() => ({ breakfast: null, lunch: null, dinner: null, snacks: [] })) };
    for (let d = 0; d < 7; d++) for (const m of slots) {
      const key = `${d}:${m}`;
      if (locked[key]) { plan.days[d][m] = locked[key]; continue; }
      const pool = pools[m];
      if (!pool.length) continue;
      // Breakfast repeats are fine; bias toward reusing ingredients already chosen.
      plan.days[d][m] = pool[Math.floor(rand() * pool.length)].id;
    }
    addSnacks(plan, s, targets);
    const ev = evaluate(plan, s, priceFeed, overrides, targets);
    if (!best || ev.score > best.score) best = { plan, ...ev };
  }
  // Local improvement: try swapping each unlocked slot for every alternative.
  for (let pass = 0; pass < 2; pass++) {
    for (let d = 0; d < 7; d++) for (const m of slots) {
      if (locked[`${d}:${m}`]) continue;
      for (const r of pools[m]) {
        if (r.id === best.plan.days[d][m]) continue;
        const trial = JSON.parse(JSON.stringify(best.plan));
        trial.days[d][m] = r.id;
        addSnacks(trial, s, targets);
        const ev = evaluate(trial, s, priceFeed, overrides, targets);
        if (ev.score > best.score) best = { plan: trial, ...ev };
      }
    }
  }
  best.plan.createdAt = new Date().toISOString();
  return {
    plan: best.plan, list: best.list, targets,
    overBudget: best.list.total > s.weeklyBudget,
    warning: empty ? `No ${empty} recipes match your dietary filters.` : null,
  };
}

// Alternatives for one slot, sorted by resulting weekly total.
function alternatives(plan, dayIdx, slot, settings, priceFeed, overrides) {
  const s = mergeSettings(settings);
  const targets = s.fitness.enabled ? fitnessTargets(s.fitness) : null;
  return candidates(slot, s).filter(r => r.id !== plan.days[dayIdx][slot]).map(r => {
    const trial = JSON.parse(JSON.stringify(plan));
    trial.days[dayIdx][slot] = r.id;
    addSnacks(trial, s, targets);
    const list = buildList(trial, s, priceFeed, overrides);
    return { recipe: r, total: list.total, nutrition: recipeNutrition(r) };
  }).sort((a, b) => a.total - b.total);
}

function applySwap(plan, dayIdx, slot, recipeId, settings) {
  const s = mergeSettings(settings);
  const trial = JSON.parse(JSON.stringify(plan));
  trial.days[dayIdx][slot] = recipeId;
  addSnacks(trial, s, s.fitness.enabled ? fitnessTargets(s.fitness) : null);
  return trial;
}

function storeSearchUrl(store, item) { return STORES[store].search(item.search); }


// ---------------- App state ----------------
const TABS = [['plan','🍽️','Plan'],['list','🛒','List'],['fitness','💪','Fitness'],['settings','⚙️','Settings']];
let state = { tab: 'plan', settings: mergeSettings(null), plan: null, locked: {}, overrides: {}, checked: {} };
let priceFeed = null, db = null, userId = null, saveTimer = null, sheet = null;
const LS_KEY = 'mealplanner-sa-v1';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'R' + Math.round(n).toLocaleString('en-ZA')}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function persisted(){return {settings:state.settings,plan:state.plan,locked:state.locked,overrides:state.overrides,checked:state.checked}}
function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(persisted()))}catch(e){}
  if(!db||!userId) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{try{await db.doc('data/users/'+userId+'/state').set(JSON.parse(JSON.stringify(persisted())))}catch(e){console.warn('save failed',e)}},800);
}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s)applySaved(s)}catch(e){}}
function applySaved(s){state.settings=mergeSettings(s.settings);state.plan=s.plan||null;state.locked=s.locked||{};state.overrides=s.overrides||{};state.checked=s.checked||{}}

function currentList(){return state.plan?buildList(state.plan,state.settings,priceFeed,state.overrides):null}

function regenerate(keepLocks=true){
  const res=generatePlan(state.settings,priceFeed,state.overrides,{locked:keepLocks?state.locked:{}});
  state.plan=res.plan;state.checked={};
  if(!keepLocks)state.locked={};
  save();render();
  if(res.warning)toast(res.warning);else if(res.overBudget)toast('Cheapest plan found is over budget');
}

// ---------------- Views ----------------
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([id,ic,l])=>`<button class="${state.tab===id?'on':''}" data-tab="${id}"><span class="ic">${ic}</span>${l}</button>`).join('');
}

function budgetCard(list){
  const b=state.settings.weeklyBudget, t=list.total, pct=Math.min(100,t/b*100), over=t>b;
  const stores=Object.entries(STORES).map(([k,v])=>`<button class="store ${state.settings.store===k?'on':''}" data-store="${k}"><span class="muted">${esc(v.name)}</span><b>${money(list.byStore[k])}</b></button>`).join('');
  return `<div class="card"><div class="row between"><div><div class="muted small">This week · ${esc(STORES[state.settings.store].name)}</div><div class="total">${money(t)}</div></div>
  <span class="pill ${over?'warn':''}">${over?money(t-b)+' over':money(b-t)+' left'} of ${money(b)}</span></div>
  <div class="bar ${over?'over':''}"><i style="width:${pct}%"></i></div>
  <div class="stores">${stores}</div>
  <div class="muted small" style="margin-top:8px">${priceFeed&&priceFeed.updatedAt?'Prices updated '+esc(new Date(priceFeed.updatedAt).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'})):'Estimated prices'} · other stores estimated from a price index</div></div>`;
}

function renderPlan(){
  if(!state.plan) return `<div class="card empty"><h2>Plan your week</h2><p class="muted">Set your household, budget and diet in Settings, then generate a 7-day plan with a costed grocery list.</p><button class="btn primary" data-act="gen">Generate my week</button> <button class="btn" data-tab="settings">Settings</button></div>`;
  const list=currentList(), s=state.settings, targets=s.fitness.enabled?fitnessTargets(s.fitness):null;
  const slots=['breakfast','lunch','dinner'].filter(m=>s.meals[m]);
  let h=budgetCard(list)+`<div class="row" style="margin-bottom:12px;gap:8px"><button class="btn primary" data-act="gen">↻ New plan</button><button class="btn" data-act="genall">Reset locks</button></div>`;
  state.plan.days.forEach((d,i)=>{
    const n=dayNutrition(d);
    let nut='';
    if(targets){const t=targets.days[i];nut=`<span class="nut">${esc(ACTIVITIES[t.activity].label)} · <span class="${n.protein>=t.protein-5?'ok':'low'}">${n.protein}/${t.protein} g protein</span> · ${n.kcal}/${t.kcal} kcal</span>`}
    else nut=`<span class="nut">${n.protein} g protein · ${n.kcal} kcal per person</span>`;
    h+=`<div class="card day"><h3>${DAYS[i]} ${nut}</h3>`;
    for(const m of slots){
      const r=d[m]&&recipeById(d[m]);
      const key=i+':'+m, lk=!!state.locked[key];
      if(!r){h+=`<div class="slot"><span class="lbl">${m}</span><span class="nm muted">No matching recipe</span></div>`;continue}
      const rn=recipeNutrition(r);
      h+=`<div class="slot"><span class="lbl">${m}</span><div class="nm" data-recipe="${r.id}" style="cursor:pointer"><b>${esc(r.name)}</b><span>${r.mins} min · ${Math.round(rn.protein*(d.portion||1))} g protein${d.portion&&d.portion!==1?' · your portion '+d.portion+'×':''}</span></div>
      <button class="icon-btn ${lk?'on':''}" title="Lock" data-lock="${key}">${lk?'🔒':'🔓'}</button><button class="icon-btn" title="Swap" data-swap="${key}">⇄</button></div>`;
    }
    if(d.snacks&&d.snacks.length)h+=`<div class="slot"><span class="lbl">Snacks</span><div class="nm"><span>${d.snacks.map(x=>esc(recipeById(x).name)).join(' · ')}</span></div></div>`;
    h+='</div>';
  });
  return h;
}

function renderList(){
  if(!state.plan) return `<div class="card empty"><p class="muted">Generate a plan first.</p><button class="btn primary" data-act="gen">Generate my week</button></div>`;
  const list=currentList(), s=state.settings;
  let h=budgetCard(list);
  h+=`<div class="card"><div class="row between"><b>Shop at ${esc(STORES[s.store].name)}</b><span class="muted small">Tap “find” to open the item on the store's site</span></div>
  <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn primary" data-act="copy">Copy list</button><button class="btn" data-act="showtext">Show as text</button><button class="btn" data-act="uncheck">Uncheck all</button></div>`;
  let aisle='';
  const main=list.items.filter(i=>s.includeStaples||!i.staple), staples=list.items.filter(i=>i.staple&&!s.includeStaples);
  for(const i of main){
    if(i.aisle!==aisle){aisle=i.aisle;h+=`<div class="aisle">${esc(aisle)}</div>`}
    const done=!!state.checked[i.id];
    h+=`<div class="item ${done?'done':''}"><input type="checkbox" data-check="${i.id}" ${done?'checked':''}><div class="nm">${esc(i.name)} <span class="muted small">× ${i.packs} · need ${formatQty(i)}</span></div><span class="small">R${i.cost.toFixed(2)}</span><a href="${esc(storeSearchUrl(s.store,i))}" target="_blank" rel="noopener">find ↗</a></div>`;
  }
  if(staples.length){h+=`<div class="aisle">Check your pantry</div>`;for(const i of staples)h+=`<div class="item"><div class="nm muted">${esc(i.name)}</div><a href="${esc(storeSearchUrl(s.store,i))}" target="_blank" rel="noopener">find ↗</a></div>`}
  h+=`</div><div class="card small muted">Store logins aren't connected: none of Checkers Sixty60, Pick n Pay asap! or Woolworths Dash offers an API for other apps. “Find” opens each product search on the store's own site, where you stay signed in.</div>`;
  return h;
}

function chipGroup(name,opts,selected){return `<div class="chips">${Object.entries(opts).map(([k,v])=>`<button class="chip ${selected.includes(k)?'on':''}" data-chip="${name}" data-val="${k}">${esc(v.label)}</button>`).join('')}</div>`}

function renderSettings(){
  const s=state.settings;
  let h=`<div class="card"><b>Household &amp; budget</b>
  <div class="grid2"><div><label class="f">People eating</label><input type="number" min="1" max="12" data-set="householdSize" value="${s.householdSize}"></div>
  <div><label class="f">Weekly budget (R)</label><input type="number" min="100" step="50" data-set="weeklyBudget" value="${s.weeklyBudget}"></div></div>
  <label class="f">Main store</label><select data-set="store">${Object.entries(STORES).map(([k,v])=>`<option value="${k}" ${s.store===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select>
  <label class="f">Meals to plan</label><div class="chips">${['breakfast','lunch','dinner'].map(m=>`<button class="chip ${s.meals[m]?'on':''}" data-meal="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
  <label class="f"><input type="checkbox" data-set="includeStaples" ${s.includeStaples?'checked':''}> Include pantry staples (oil, spices, flour) in the total</label></div>
  <div class="card"><b>Dietary requirements</b><label class="f">Must avoid</label>${chipGroup('diets',DIETS,s.diets)}<label class="f">Preferences</label>${chipGroup('prefs',PREFERENCES,s.prefs)}
  <p class="small muted">Halal: buy halal-certified meat. Boerewors is treated as containing pork. Stock cubes, oats and soy sauce are treated as containing gluten.</p></div>
  <div class="card"><div class="row between"><b>Prices</b><span class="small muted">${priceFeed&&priceFeed.updatedAt?'Feed: '+esc(priceFeed.source||'')+' '+esc(new Date(priceFeed.updatedAt).toLocaleDateString('en-ZA')):'Built-in estimates'}</span></div>
  <p class="small muted">Base prices are Checkers. Type your own price to override it.</p><table>`;
  for(const [id,ing] of Object.entries(INGREDIENTS)){
    const base=priceOf(id,'checkers',priceFeed,null);
    h+=`<tr><td>${esc(ing.name)}</td><td style="text-align:right"><input type="number" step="0.01" placeholder="${base.toFixed(2)}" data-price="${id}" value="${state.overrides[id]??''}"></td></tr>`;
  }
  h+=`</table></div><div class="card small muted">${userId?'Saved to your account.':'Saved on this device.'}</div>`;
  return h;
}

function renderFitness(){
  const f=state.settings.fitness;
  let h=`<div class="card"><div class="row between"><b>Fitness mode</b><button class="chip ${f.enabled?'on':''}" data-fit-toggle>${f.enabled?'On':'Off'}</button></div>
  <p class="small muted">Plans aim at your daily protein and calories, scale your portions on training days, and add protein snacks to the grocery list when meals fall short. Targets are for one person in the household.</p></div>`;
  if(!f.enabled) return h;
  const t=fitnessTargets(f);
  h+=`<div class="card"><b>Your targets</b><div class="grid2" style="margin-top:8px"><div><div class="muted small">Protein / day</div><div class="total">${t.protein} g</div><div class="small muted">${t.perKg} g per kg</div></div><div><div class="muted small">Rest-day calories</div><div class="total">${t.restKcal}</div><div class="small muted">BMR ${t.bmr} kcal</div></div></div></div>
  <div class="card"><b>Body &amp; goal</b><div class="grid2">
  <div><label class="f">Weight (kg)</label><input type="number" data-fit="weightKg" value="${f.weightKg}"></div>
  <div><label class="f">Height (cm)</label><input type="number" data-fit="heightCm" value="${f.heightCm}"></div>
  <div><label class="f">Age</label><input type="number" data-fit="age" value="${f.age}"></div>
  <div><label class="f">Sex (for calorie formula)</label><select data-fit="sex"><option value="male" ${f.sex==='male'?'selected':''}>Male</option><option value="female" ${f.sex==='female'?'selected':''}>Female</option></select></div></div>
  <label class="f">Goal</label><select data-fit="goal">${Object.entries(GOALS).map(([k,v])=>`<option value="${k}" ${f.goal===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select>
  <div class="grid2"><div><label class="f">Protein target override (g/day)</label><input type="number" data-fit="proteinOverride" placeholder="${t.protein}" value="${f.proteinOverride??''}"></div>
  <div><label class="f">Rest-day kcal override</label><input type="number" data-fit="kcalOverride" placeholder="${t.restKcal}" value="${f.kcalOverride??''}"></div></div>
  <label class="f"><input type="checkbox" data-fit="snacks" ${f.snacks?'checked':''}> Add protein snacks to close gaps</label></div>
  <div class="card"><b>Weekly training</b><p class="small muted">Training days get more food.</p>`;
  DAYS.forEach((d,i)=>{h+=`<div class="row between" style="padding:6px 0;border-top:1px solid var(--line)"><span>${d}</span><select style="width:60%" data-week="${i}">${Object.entries(ACTIVITIES).map(([k,v])=>`<option value="${k}" ${f.week[i]===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select><span class="small muted" style="width:70px;text-align:right">${t.days[i].kcal} kcal</span></div>`});
  h+=`</div><div class="card"><button class="btn primary" data-act="gen">Re-plan with these targets</button></div><p class="small muted">Estimates only (Mifflin-St Jeor formula plus typical exercise burn), not medical advice.</p>`;
  return h;
}

function renderSheet(){
  document.querySelectorAll('.sheet-bg').forEach(e=>e.remove());
  if(!sheet) return;
  const bg=document.createElement('div');bg.className='sheet-bg';bg.dataset.close='1';
  let inner='';
  if(sheet.type==='swap'){
    const [d,slot]=sheet.key.split(':');
    const alts=alternatives(state.plan,+d,slot,state.settings,priceFeed,state.overrides);
    inner=`<h2>Swap ${DAYS[d]} ${slot}</h2>`+alts.map(a=>`<div class="alt" data-pick="${a.recipe.id}"><div><b>${esc(a.recipe.name)}</b><div class="nut">${a.nutrition.protein} g protein · ${a.nutrition.kcal} kcal · ${a.recipe.mins} min</div></div><span class="small">week ${money(a.total)}</span></div>`).join('');
  } else if(sheet.type==='recipe'){
    const r=recipeById(sheet.id), n=recipeNutrition(r), hh=state.settings.householdSize;
    inner=`<h2>${esc(r.name)}</h2><div class="nut">${r.mins} min · per person ${n.protein} g protein · ${n.kcal} kcal</div><div class="aisle">Ingredients for ${hh}</div>`+
      Object.entries(r.ing).map(([id,q])=>{const ing=INGREDIENTS[id];const qq=q*hh/4;return `<div class="small">• ${esc(ing.name)} — ${formatQty({qty:qq,unit:ing.unit})}</div>`}).join('')+
      `<div class="aisle">Method</div>`+r.steps.map((s,i)=>`<div class="small">${i+1}. ${esc(s)}</div>`).join('');
  } else if(sheet.type==='text'){
    inner=`<h2>Grocery list</h2><textarea readonly>${esc(listAsText(currentList(),state.settings))}</textarea>`;
  }
  bg.innerHTML=`<div class="sheet">${inner}<div style="margin-top:12px"><button class="btn" data-close="1">Close</button></div></div>`;
  document.body.appendChild(bg);
}

function render(){
  renderNav();
  const v={plan:renderPlan,list:renderList,fitness:renderFitness,settings:renderSettings}[state.tab]();
  document.getElementById('app').innerHTML=v;
  const s=state.settings;
  document.getElementById('sub').textContent=`${s.householdSize} ${s.householdSize==1?'person':'people'} · ${money(s.weeklyBudget)}/week${s.diets.length?' · '+s.diets.map(d=>DIETS[d].label).join(', '):''}`;
  renderSheet();
}

// ---------------- Events ----------------
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-store],[data-lock],[data-swap],[data-recipe],[data-chip],[data-meal],[data-fit-toggle],[data-pick],[data-close]');
  if(!t) return;
  if(t.dataset.close&&e.target!==t&&!e.target.closest('button'))return;
  if(t.dataset.tab){state.tab=t.dataset.tab;sheet=null;render();window.scrollTo(0,0);return}
  if(t.dataset.close){sheet=null;renderSheet();return}
  if(t.dataset.store){state.settings.store=t.dataset.store;save();render();return}
  if(t.dataset.lock){const k=t.dataset.lock;if(state.locked[k])delete state.locked[k];else state.locked[k]=state.plan.days[+k.split(':')[0]][k.split(':')[1]];save();render();return}
  if(t.dataset.swap){sheet={type:'swap',key:t.dataset.swap};renderSheet();return}
  if(t.dataset.recipe){sheet={type:'recipe',id:t.dataset.recipe};renderSheet();return}
  if(t.dataset.pick){const [d,slot]=sheet.key.split(':');state.plan=applySwap(state.plan,+d,slot,t.dataset.pick,state.settings);state.locked[sheet.key]=t.dataset.pick;sheet=null;save();render();return}
  if(t.dataset.chip){const arr=state.settings[t.dataset.chip];const i=arr.indexOf(t.dataset.val);if(i>=0)arr.splice(i,1);else arr.push(t.dataset.val);save();render();return}
  if(t.dataset.meal){state.settings.meals[t.dataset.meal]=!state.settings.meals[t.dataset.meal];save();render();return}
  if(t.hasAttribute('data-fit-toggle')){state.settings.fitness.enabled=!state.settings.fitness.enabled;save();render();return}
  const a=t.dataset.act;
  if(a==='gen'){regenerate(true);state.tab='plan';render();window.scrollTo(0,0)}
  if(a==='genall'){regenerate(false)}
  if(a==='uncheck'){state.checked={};save();render()}
  if(a==='showtext'){sheet={type:'text'};renderSheet()}
  if(a==='copy'){try{await navigator.clipboard.writeText(listAsText(currentList(),state.settings));toast('List copied')}catch(err){sheet={type:'text'};renderSheet()}}
});
document.addEventListener('change',e=>{
  const t=e.target, s=state.settings;
  if(t.dataset.check){if(t.checked)state.checked[t.dataset.check]=true;else delete state.checked[t.dataset.check];save();render();return}
  if(t.dataset.set){const k=t.dataset.set;s[k]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(1,Number(t.value)||1):t.value;save();render();return}
  if(t.dataset.price){const v=t.value.trim();if(v==='')delete state.overrides[t.dataset.price];else state.overrides[t.dataset.price]=Number(v);save();render();return}
  if(t.dataset.fit){const k=t.dataset.fit;let v=t.type==='checkbox'?t.checked:t.value;if(t.type==='number')v=v===''?(k.endsWith('Override')?null:s.fitness[k]):Number(v);s.fitness[k]=v;save();render();return}
  if(t.dataset.week){s.fitness.week[+t.dataset.week]=t.value;save();render();return}
});

// ---------------- Boot ----------------
loadLocal();
render();
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d)return;
    db=d;
    // Shared price feed, refreshed monthly.
    let timer=setTimeout(()=>{},10000);
    db.doc('prices/current').onSnapshot(snap=>{clearTimeout(timer);if(snap.exists){priceFeed=snap.data();render()}},()=>clearTimeout(timer));
    const id=u?await u.id():null;
    if(!id)return;
    userId=id;
    const snap=await db.doc('data/users/'+id+'/state').get();
    if(snap.exists){applySaved(snap.data());render()} else if(state.plan||state.settings){save()}
    render();
  }catch(e){console.warn(e)}
})();
</script>
</body>
</html>
